# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# Upstream identifiers that keep their US spelling. Each pattern is one
# exact inline code span, so the same spelling anywhere else, including any
# other code span, is still checked.
ignore = [
  # axe-core rule.
  '`color-contrast`',
  # CSS media feature.
  '`prefers-color-scheme`',
]

[files]
exclude = []
